name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "Galeria"
      NEXT_PUBLIC_PHOTOGRAPHER: "Galeria"
      AUTH_SECRET: "ci-only-secret-change-me-000000000000000000"
      PAYMENTS_MOCK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm test
      - run: pnpm build
